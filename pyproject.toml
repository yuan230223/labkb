[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "labkb"
version = "0.1.0"
description = "A local-first, citation-oriented knowledge assistant for small research groups"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115.6,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "python-multipart>=0.0.22,<1", "pydantic>=2.10,<3",
  "pypdf>=6.1,<7", "python-docx>=1.1.2,<2", "python-dotenv>=1.0.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
labkb = "labkb.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
labkb = ["static/*", "samples/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
